<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101b17"><title>HOME GAME｜德州撲克</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>
<header><div class="brand">♠ HOME GAME <span> TEXAS HOLD’EM</span></div><button id="soundToggle" class="soundToggle" type="button">🔊 音效開</button><div id="connection" class="status">● 尚未連線</div></header>
<main>
<section id="lobby" class="panel">
  <div class="eyebrow">PRIVATE POKER ROOM</div><h1>今晚，開一桌。</h1><p class="muted">純娛樂籌碼・最多 8 位玩家・手機與電腦即時同步</p>
  <label>你的暱稱<input id="name" maxlength="16" placeholder="輸入玩家名稱" value="玩家 1"></label>
  <div class="grid2">
    <div class="subpanel"><h2>建立新房間</h2>
      <label>小盲注<input id="sb" type="number" min="1" value="10"></label>
      <label>大盲注<input id="bb" type="number" min="2" value="20"></label>
      <label>預設攜帶籌碼<input id="buyin" type="number" min="100" value="2000"></label>
      <button id="create" class="primary">建立私人房間</button>
    </div>
    <div class="subpanel"><h2>加入朋友房間</h2>
      <label>房間代碼<input id="code" maxlength="6" placeholder="例如 A1B2C3"></label>
      <label>攜帶籌碼<input id="joinBuy" type="number" min="100" value="2000"></label>
      <button id="join" class="secondary">加入牌桌</button>
    </div>
  </div>
  <p id="error" class="error" aria-live="polite"></p>
  <p class="fine">遊戲僅使用虛擬籌碼，不提供現金交易或兌換。</p>
</section>

<section id="tableView" hidden>
  <div class="tableTop"><div><span class="eyebrow">PRIVATE TABLE</span><h2>房間 <strong id="roomCode"></strong></h2></div>
    <button id="copy" class="secondary small">複製邀請資訊</button>
  </div>
  <div class="table">
    <div class="tableInner">
      <div id="seats" class="seats"></div>
      <div class="center">
        <div class="pot">POT <strong id="pot">0</strong></div>
        <div id="community" class="cards community"><span class="back">?</span><span class="back">?</span><span class="back">?</span><span class="back">?</span><span class="back">?</span></div>
        <div id="message" class="message">等待玩家加入</div><div id="turnClock" class="turnClock" hidden></div>
      </div>
    </div>
  </div>
  <div class="tableBottom">
    <div class="settingsLine"><span id="blinds">SB 10 / BB 20</span><span id="phase">等待開始</span><span id="playerCount">0 / 8 人</span></div>
    <div id="myCards" class="myCards"></div><div id="revealPanel" class="revealPanel" hidden><button id="revealCards" type="button">🃏 翻開手牌（Show）</button><span id="revealHint"></span></div>
    <div id="actions" class="actions" hidden>
      <button data-action="fold" class="danger">Fold 棄牌</button>
      <button data-action="check" class="secondary">Check 過牌</button>
      <button data-action="call" class="secondary">Call 跟注</button>
      <div class="raisePresets" aria-label="加注快捷選項"><button type="button" data-bb="2">2BB</button><button type="button" data-bb="3">3BB</button><button type="button" data-bb="4">4BB</button><button type="button" data-bb="5">5BB</button></div>
      <div class="raiseBox"><input id="raiseAmount" type="number" min="1" value="40"><button data-action="raise" class="primary">Raise 加注</button></div>
      <button data-action="allin" class="allin">All-in 全押</button>
    </div>
    <div class="hostActions"><button id="addAI" class="secondary">＋ 加入 AI</button><button id="start" class="primary">開始／下一手</button></div>
  </div>
</section>
</main>
<footer>HOME GAME · PLAY FOR FUN</footer>
<script src="/socket.io/socket.io.js"></script><script src="/app.js"></script>
</body></html>
